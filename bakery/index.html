.bubble .pb i{display:block;height:100%;background:var(--green)}

.nametag{position:absolute;transform:translate(-50%,-100%);font-size:12px;background:rgba(90,63,46,.7);color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}

.visiting .side .homeonly,.visiting .lvl,.visiting #coins{display:none}

.gb{background:var(--paper);border-radius:14px;padding:9px 12px;box-shadow:0 3px 0 var(--line);font-size:15px}
.gb small{color:var(--ink2);display:block;font-size:12px;margin-bottom:2px}
@media (max-width:520px){.lvl .bar{width:70px}.pill{font-size:14px;padding:6px 11px}}
</style>

const grad = (() => {
  const d = new Uint8Array([120,120,120,255, 200,200,200,255, 255,255,255,255]);

})();
const matCache = new Map();
function M(color, extra){
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (!extra && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({color, gradientMap:grad, ...(extra||{})});
  if (!extra) matCache.set(key, m);
  return m;
}
function mesh(geo, mat, x=0, y=0, z=0, shadow=true){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);

function animateAnimal(a, moving, dt){
  const u = a.userData; u.t += dt*(moving?12:3);
  u.rig.position.y = moving ? Math.abs(Math.sin(u.t))*.09 : Math.sin(u.t)*.015;
  u.feet[0].position.z = .06 + (moving? Math.sin(u.t)*.18:0);
  u.feet[1].position.z = .06 - (moving? Math.sin(u.t)*.18:0);
  u.arms[0].position.y = .78 + (moving? Math.sin(u.t)*.05:0);
  u.arms[1].position.y = .78 - (moving? Math.sin(u.t)*.05:0);
  u.head.rotation.z = moving ? 0 : Math.sin(u.t*.5)*.05;
}

function makeBread(type, done='good', tops=[]){
  const g = new THREE.Group();

  const b = M(base), lt = M(shade(base,.12));
  let topY = .2;

    case 'croissant': { const t = mesh(new THREE.TorusGeometry(.22,.12,10,16,Math.PI*1.25), b,0,.12,0); t.rotation.x=Math.PI/2; t.rotation.z=-.4; g.add(t);} topY=.24; break;
    case 'bagel': { const t = mesh(new THREE.TorusGeometry(.2,.1,10,18), b,0,.1,0); t.rotation.x=Math.PI/2; g.add(t);} topY=.2; break;
    case 'donut': { const t = mesh(new THREE.TorusGeometry(.2,.12,10,18), b,0,.12,0); t.rotation.x=Math.PI/2; g.add(t);} topY=.24; break;
    case 'cookie': g.add(mesh(G.cyl(.25,.25,.07,16), b,0,.04,0)); for (let i=0;i<4;i++) g.add(mesh(G.sph(.04,6,4),M(0x5b3520),Math.cos(i*1.6)*.13,.08,Math.sin(i*1.6)*.13)); topY=.1; break;
    case 'cupcake': g.add(mesh(G.cyl(.2,.14,.22,12), M(0xf7b7c8),0,.11,0)); g.add(mesh(G.sph(.22), b,0,.26,0)); topY=.46; break;
    case 'pretzel': { const t = mesh(new THREE.TorusKnotGeometry(.15,.05,40,6,2,3), b,0,.12,0); t.scale.set(1.2,1.2,.6); t.rotation.x=Math.PI/2; g.add(t);} topY=.2; break;
    case 'pie': g.add(mesh(G.cyl(.3,.24,.14,16), b,0,.07,0)); g.add(mesh(G.cyl(.25,.25,.02,16), M(0xb33a4a),0,.145,0)); topY=.17; break;
    case 'cake': { const c = mesh(G.cyl(.3,.3,.3,3), M(0xfff1dc),0,.15,0); c.rotation.y=Math.PI/6; g.add(c);
      const l = mesh(G.cyl(.31,.31,.05,3), b,0,.15,0); l.rotation.y=Math.PI/6; g.add(l);} topY=.32; break;
  }
  tops.forEach((t, i) => {
    const col = TOPS[t].color, off = i*.06;
    if (t==='berry'){ const s = mesh(G.cone(.07,.13,8), M(col),.04-off,topY+.06,0); s.rotation.x=Math.PI; g.add(s); }
    else if (t==='blue'){ for (let k=0;k<3;k++) g.add(mesh(G.sph(.045,8,6), M(col), Math.cos(k*2.1)*.09, topY+.03+off, Math.sin(k*2.1)*.09)); }
    else if (t==='cream'){ g.add(mesh(G.cone(.11,.16,10), M(col),0,topY+.08+off,0)); }
    else if (t==='sprink'){ for (let k=0;k<8;k++){ const s = mesh(G.box(.05,.015,.015), M([0xff8fd0,0x7fd3ff,0xffe066,0x9be38a][k%4]), Math.cos(k)*.13, topY+off, Math.sin(k*1.7)*.13, false); s.rotation.y=k; g.add(s);} }
    else { const s = mesh(G.sph(.2,12,6,), M(col, t==='honey'?{transparent:true,opacity:.8}:undefined), 0,topY-.08+off,0, false); s.scale.set(1.05,.25,1.05); g.add(s); }
  });
  return g;

function makeTree(round=true, scale=1){

  g.scale.setScalar(scale); return g;

function collide(x, z, r){
  for (const c of colliders.concat(decoColliders)){
    if (c.box){ const b = c.box; const nx = Math.max(b.minX, Math.min(x, b.maxX)), nz = Math.max(b.minZ, Math.min(z, b.maxZ));
      const dx = x-nx, dz = z-nz, d = Math.hypot(dx,dz);
      if (d < r){ if (d < 1e-4){ z = b.maxZ + r; } else { x = nx + dx/d*r; z = nz + dz/d*r; } } }
    else { const dx = x-c.x, dz = z-c.z, d = Math.hypot(dx,dz), m = r + c.r; if (d < m && d > 1e-4){ x = c.x + dx/d*m; z = c.z + dz/d*m; } }
  }
  const d = Math.hypot(x,z); if (d > WORLD_R){ x *= WORLD_R/d; z *= WORLD_R/d; }
  return [x,z];
}

let actx = null;

function beep(notes, type='sine', vol=.08){
  if (!actx) return; let t = actx.currentTime;
  for (const [f, d] of notes){ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d); t += d*.7; }
}

  happy:()=>beep([[784,.1],[988,.1],[1175,.2]],'triangle',.07), sad:()=>beep([[440,.15],[392,.25]],'sine',.06), lvl:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.3]],'triangle',.08) };

function randOrder(){
  const breads = Object.keys(BREADS).filter(k=>BREADS[k].lv<=S.level), tops = Object.keys(TOPS).filter(k=>TOPS[k].lv<=S.level);
  const nTop = S.level<2 ? (Math.random()<.4?1:0) : Math.floor(Math.random()*Math.min(3, 1+Math.ceil(S.level/2)));

function serve(){
  const cs = customers().filter(c=>c.state==='wait').sort((a,b)=>a.slot-b.slot);
  if (!cs.length){ toast('기다리는 손님이 없어요'); return; }
  const n = cs.find(c=>c.order.type===holding.type);
  if (!n){ say(cs[0], `음… 저는 ${BREADS[cs[0].order.type].name}을(를) 주문했어요!`); SFX.sad(); return; }
  const exact = n.order.tops.join()===[...holding.tops].sort().join();
  const mult = {perfect:1.5, good:1, raw:.6, burnt:.6}[holding.done] * (exact?1:.7);
  const price = Math.round((BREADS[holding.type].price + 4*n.order.tops.length) * mult);
  let fr = 1 + (exact && holding.done==='perfect' ? 1 : 0) + (n.order.type===n.A.fav ? 1 : 0);
  if (!exact || holding.done==='burnt' || holding.done==='raw') fr = Math.max(0, fr-1);
  S.coins += price; S.stats.served++; if (exact && holding.done==='perfect') S.stats.perfect++;
  const lines = !exact ? ['고마워! 토핑은 좀 다르지만 맛있겠다', '어라, 토핑이 조금 다르네? 괜찮아!'] :
    holding.done==='perfect' ? ['우와, 완벽해! 최고의 빵이야!', '냄새부터 황금빛이야!!'] :
    holding.done==='good' ? ['맛있어 보여! 고마워~', '딱 내가 원하던 거야!'] : ['음… 그래도 고마워!', '조금 아쉽지만 잘 먹을게'];

  const b = makeBread(holding.type, holding.done, holding.tops); n.obj.userData.hand.add(b);
  const xp = exact ? (holding.done==='perfect'?10:holding.done==='good'?8:5) : 5;
  holding = null; refreshHeld();
  SFX.coin(); toast(`🪙 +${price}  ·  ${n.A.name} 💗+${fr}`);

}

let ghost = null;
const raycaster = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function startDeco(item=null){
  if (mode!=='home') return;
  deco = {item, rot:0, gx:0, gz:0, manual:false};
  $('decobar').classList.add('show'); setGhost();
  toast(item ? '놓을 곳으로 가서(또는 땅을 눌러서) [놓기]를 눌러요' : '물건 가까이 가서 [치우기]로 가방에 넣을 수 있어요');
}
function endDeco(){ deco = null; setGhost(); $('decobar').classList.remove('show'); markDirty(); }
function setGhost(){
  if (ghost){ world.remove(ghost); ghost = null; }
  if (!deco || !deco.item) return;
  ghost = makeItem(deco.item); ghost.traverse(o => { if (o.isMesh){ o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .6; o.castShadow = false; } });
  world.add(ghost);
}
function rotateDeco(){ if (!deco) return; deco.rot = (deco.rot+1)%4; SFX.pop(); }
function placeGhostAtScreen(cx, cy){
  raycaster.setFromCamera({x:cx/innerWidth*2-1, y:-(cy/innerHeight)*2+1}, camera);
  const p = new THREE.Vector3(); if (!raycaster.ray.intersectPlane(groundPlane, p)) return;
  deco.gx = Math.round(p.x*2)/2; deco.gz = Math.round(p.z*2)/2; deco.manual = true;
}
function ghostValid(x, z){
  if (Math.hypot(x,z) > WORLD_R-.5) return false;
  if (x > -7 && x < 7 && z > -14 && z < -1.2) return false; // 빵집 앞마당
  if (Math.hypot(x+3, z-1.8) < 1) return false;
  for (const c of decoColliders) if (Math.hypot(x-c.x, z-c.z) < c.r + (ITEMS[deco.item].r||.3)) return false;
  for (const p of S.placed) if (Math.hypot(x-p.x, z-p.z) < .7) return false;
  return true;
}
function nearestPlaced(){
  let best = -1, bd = 1.8;
  S.placed.forEach((p,i) => { const d = Math.hypot(P.x-p.x, P.z-p.z); if (d < bd){ bd = d; best = i; } });
  return best;
}
function decoAction(){
  if (deco.item){
    const x = deco.gx, z = deco.gz;
    if (!ghostValid(x,z)){ toast('여기에는 놓을 수 없어요'); SFX.sad(); return; }
    S.placed.push({id:deco.item, x, z, r:deco.rot}); S.items[deco.item]--; SFX.pop();
    if (S.items[deco.item] <= 0){ delete S.items[deco.item]; deco.item = null; setGhost(); toast('다 놓았어요! 가방에서 다른 물건을 골라요'); }
    deco.manual = false;
    buildDeco(S); markDirty();
  } else {
    const i = nearestPlaced(); if (i < 0){ toast('가방에서 놓을 물건을 골라요 🎒'); return; }
    const p = S.placed.splice(i,1)[0]; S.items[p.id] = (S.items[p.id]||0)+1; SFX.pop(); toast(`${ITEMS[p.id].em} 가방에 넣었어요`);
    buildDeco(S); markDirty();
  }
}

function computeAction(){
  if (deco){ if (deco.item) return {label:'놓기', fn:decoAction}; return nearestPlaced()>=0 ? {label:'치우기', fn:decoAction} : null; }
  const d = (o, r) => Math.hypot(P.x-o.position.x, P.z-o.position.z) < r;
  if (mode==='visit'){
    if (d(mailbox, 2)) return {label:'방명록', fn:writeGuestbook};
    const owner = npcs.find(n=>n.kind==='owner'); if (owner && d(owner.obj, 2.2)) return {label:'인사하기', fn:()=>{ say(owner, `어서 와! ${viewData.name}의 빵집이야`); SFX.ding(); }};
    const r = npcs.find(n=>n.kind==='resident' && d(n.obj, 1.8)); if (r) return {label:'말 걸기', fn:()=>{ say(r, r.A.line); SFX.pop(); }};
    return null;
  }
  if (d(oven, 2.4)) return {label:holding?'다시 굽기':'굽기', fn:openOven};
  if (d(decoTable, 2.4)) return {label:'장식', fn:openDeco};
  if (holding && Math.hypot(P.x-counter.position.x, P.z-counter.position.z) < 3.2) return {label:'건네기', fn:serve};
  if (d(mailbox, 1.8)) return {label:'편지함', fn:openMail};
  const r = npcs.find(n=>n.kind==='resident' && !n.busy && d(n.obj, 1.8)); if (r) return {label:'말 걸기', fn:()=>{ say(r, `${r.A.line} (💗${S.friends[r.A.id]||0})`); SFX.pop(); }};
  return null;
}

const skyDay = new THREE.Color(0xcfe9f7), skyEve = new THREE.Color(0xffc9a8), skyNight = new THREE.Color(0x2c3561), tmpC = new THREE.Color();
function updateSky(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  let night = 0, eve = 0;
  if (h >= 19.5 || h < 5) night = 1; else if (h >= 17.5) { eve = Math.min(1,(h-17.5)/1); night = Math.max(0,(h-18.5)/1); } else if (h < 6.5) { night = 1-(h-5)/1.5; eve = night*.6; }
  tmpC.copy(skyDay).lerp(skyEve, eve).lerp(skyNight, night);
  scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  hemi.intensity = 1.15 - night*.55; sun.intensity = 1.5 - night*1.1;
  sun.color.setHex(eve > .3 && night < .5 ? 0xffc79a : night > .5 ? 0x9fb0ff : 0xfff0d6);
  const glow = night > .3 ? .9 : 0;
  windowMats.forEach(m => m.emissiveIntensity = glow);
  world.traverse(o => { if (o.userData.glow) o.material.emissiveIntensity = .3 + glow; if (o.userData.window) o.material.emissiveIntensity = glow*.9; });
}

/* ================= 메인 루프 ================= */
let last = performance.now(), skyT = 0;
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(.1, (now-last)/1000); last = now;
  if (!player){ renderer.render(scene, camera); return; }
  if (!paused){
    // 이동
    let ix = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0) + joyV.x;
    let iz = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0) + joyV.y;
    const il = Math.hypot(ix, iz); if (il > 1){ ix/=il; iz/=il; }
    const sp = 6;
    let nx = P.x + ix*sp*dt, nz = P.z + iz*sp*dt;
    [nx, nz] = collide(nx, nz, .45); P.x = nx; P.z = nz;
    const moving = il > .1;
    if (moving){ const tr = Math.atan2(ix, iz); let dr = tr - P.rot; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); P.rot += dr*Math.min(1, dt*12); }
    player.position.set(P.x, 0, P.z); player.rotation.y = P.rot; animateAnimal(player, moving, dt);
    // 손님 생성
    if (mode==='home'){ spawnT -= dt; if (spawnT <= 0){ spawnCustomer(); spawnT = 9 + Math.random()*9 - Math.min(5, S.level*.6); } }
  }
  // NPC
  for (const n of [...npcs]){
    const o = n.obj; let moving = false;
    if (n.kind==='customer'){
      if (n.state==='walk' || n.state==='leave'){
        const dx = n.tx-o.position.x, dz = n.tz-o.position.z, dd = Math.hypot(dx,dz);
        if (dd > .1){ const s = Math.min(dd, 4.2*dt); o.position.x += dx/dd*s; o.position.z += dz/dd*s; o.rotation.y = Math.atan2(dx,dz); moving = true; }
        else if (n.state==='walk'){ n.state='wait'; o.rotation.y = Math.hypot(P.x-o.position.x, P.z-o.position.z) < 7 ? Math.atan2(P.x-o.position.x, P.z-o.position.z) : Math.PI; SFX.ding(); n.bubble.style.display=''; }
        else { // 떠남 완료
          if (n.resident){ n.kind='resident'; n.busy=false; n.resident.busy=false; const i = npcs.indexOf(n); npcs.splice(i,1); n.resident.label.style.display='';
            const h = o.userData.hand; h.clear(); n.resident.tx=n.tx; n.resident.tz=n.tz; }
          else removeNpc(n);
          continue;
        }
      } else if (n.state==='wait' && !paused){
        n.patience -= dt; o.rotation.y = Math.hypot(P.x-o.position.x, P.z-o.position.z) < 7 ? Math.atan2(P.x-o.position.x, P.z-o.position.z) : Math.PI;
        if (n.patience <= 0){ customerLeave(n, false); SFX.sad(); continue; }
      }
      if (n.bubble){ n.bubble.innerHTML = `${orderHtml(n.order)}<div class="pb"><i style="width:${n.patience/n.maxP*100}%;background:${n.patience/n.maxP<.3?'var(--red)':'var(--green)'}"></i></div>`; placeLabel(n.bubble, o, 2.6); }
    } else if (n.kind==='resident'){
      if (n.busy) { continue; }
      n.wait -= dt;
      const dx = n.tx-o.position.x, dz = n.tz-o.position.z, dd = Math.hypot(dx,dz);
      if (dd > .15){ const s = Math.min(dd, 1.6*dt); o.position.x += dx/dd*s; o.position.z += dz/dd*s; o.rotation.y = Math.atan2(dx,dz); moving = true; }
      else if (n.wait <= 0){ const a = Math.random()*Math.PI*2, r = 1.5+Math.random()*3.5; n.tx = n.home[0]*.8 + Math.cos(a)*r; n.tz = n.home[1]*.8 + Math.sin(a)*r; n.wait = 2+Math.random()*4; }
      placeLabel(n.label, o, 2.35);
    } else if (n.kind==='owner'){ o.rotation.y = Math.atan2(P.x-o.position.x, P.z-o.position.z); placeLabel(n.label, o, 2.6); }
    animateAnimal(o, moving, dt);
  }
  // 꾸미기 고스트
  if (deco && deco.item && ghost){
    if (!deco.manual){ deco.gx = Math.round((P.x + Math.sin(P.rot)*1.8)*2)/2; deco.gz = Math.round((P.z + Math.cos(P.rot)*1.8)*2)/2; }
    ghost.position.set(deco.gx, .02, deco.gz); ghost.rotation.y = deco.rot*Math.PI/2;
    const ok = ghostValid(deco.gx, deco.gz); ghost.traverse(o => { if (o.isMesh) o.material.opacity = ok ? .65 : .25; });
    if (Math.hypot(ix0(),iz0())>.1) deco.manual = false;
  }
  // 장식 애니메이션
  decoGroup.traverse(o => { if (o.userData.spin2) o.rotation.z += dt*.8; if (o.userData.spin) o.position.y = 1.55 + Math.sin(now/300)*.06; });
  smoke.forEach(s => { s.userData.t = (s.userData.t + dt*.18) % 1; const t = s.userData.t; s.position.set(3.2 + Math.sin(t*6)*.3, 7.3 + t*4, -10.6); s.scale.setScalar(.5 + t*1.2); s.material.opacity = .65*(1-t); });
  // 행동 버튼
  if (!paused){ const a = computeAction(); currentAction = a; if (a){ actionBtn.textContent = a.label; actionBtn.classList.add('show'); } else actionBtn.classList.remove('show'); }
  else actionBtn.classList.remove('show');
  // 카메라
  const tx = P.x, tz = P.z;
  camera.position.lerp(_v.set(tx, 13*camZoom, tz + 12.5*camZoom), Math.min(1, dt*5));
  camera.lookAt(tx, 1, tz - 1);
  sun.position.set(tx + 10, 22, tz + 8); sun.target.position.set(tx, 0, tz);
  skyT -= dt; if (skyT <= 0){ updateSky(); skyT = 30; }
  renderer.render(scene, camera);
}

      const {error} = await sb.from('villages').insert({user_id:user.id, nickname:name, data:d, level:d.level});
      m.querySelector('#ok').disabled = false;
      if (error){ err.textContent = error.code==='23505' ? '이미 누가 쓰는 이름이에요. 다른 이름을 골라주세요' : '저장 실패: '+error.message; return; }
    }
    S = d; closeModal(true); enterHome(true);
  };
}
function enterHome(first){
  mode = 'home'; viewData = S; visitInfo = null; document.body.classList.remove('visiting'); $('visitbar').classList.remove('show');
  P.x = 0; P.z = 1.5; P.rot = Math.PI; holding = holding || null;
  buildVillage(S); buildPlayer(); updateHud(); updateSky(); paused = false; spawnT = 2;
  try{ localStorage.setItem(localKey(), JSON.stringify(S)); }catch(e){}
  if (first) setTimeout(() => letter('꼬마 빵집에 온 걸 환영해요!', `숲속 동물들이 빵을 사러 올 거예요.<br><br>
    1. 손님 머리 위 <b>주문</b>을 보고<br>2. 왼쪽 <b>🔥오븐</b>에서 빵을 굽고<br>3. 오른쪽 <b>🎨장식대</b>에서 토핑을 올려<br>4. <b>카운터</b>에서 건네주세요!<br><br>
    단골이 되면 선물을 주고, 더 친해지면 마을로 이사 와요 🏡`), 500);
  if (ONLINE && user) checkMail(true);
}

/* ================= 이웃 / 방명록 ================= */
async function openVisit(){
  if (!ONLINE || !user){ openModal(`<h2>🏡 이웃 마을</h2><p class="sub">이웃 방문은 로그인해야 쓸 수 있어요.${ONLINE?'<br>메뉴 → 로그아웃 후 로그인해 주세요.':'<br>(지금은 서버 연결 전 체험 모드예요)'}</p>`); return; }
  const m = openModal(`<h2>🏡 이웃 마을</h2><p class="sub">놀러 갈 마을을 골라요</p>
    <div class="row" style="margin:0 0 10px"><input id="q" placeholder="이름으로 찾기" style="margin:0"><button class="btn" style="width:auto" id="qs">찾기</button></div>
    <div class="list" id="vl"><p class="sub">불러오는 중…</p></div>`);
  const load = async (q) => {
    let req = sb.from('villages').select('user_id,nickname,level,hearts,updated_at').neq('user_id', user.id).order('updated_at', {ascending:false}).limit(30);
    if (q) req = req.ilike('nickname', `%${q.replace(/[%_]/g,'')}%`);
    const {data, error} = await req; const vl = m.querySelector('#vl'); if (!vl) return;
    if (error){ vl.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
    vl.innerHTML = data.length ? data.map(v => `<div class="li"><div class="grow"><div>${esc(v.nickname)}의 빵집</div><small>Lv.${v.level} · 💗${v.hearts} · ${ago(v.updated_at)}</small></div><button data-id="${v.user_id}">놀러 가기</button></div>`).join('')
      : '<p class="sub">아직 다른 마을이 없어요. 친구에게 게임 주소를 알려줘요!</p>';
    vl.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => visit(b.dataset.id));
  };
  m.querySelector('#qs').onclick = () => load(m.querySelector('#q').value.trim());
  m.querySelector('#q').onkeydown = e => { if (e.key==='Enter') load(e.target.value.trim()); };
  load('');
}
function ago(ts){ const s = (Date.now()-new Date(ts))/1000; if (s<3600) return Math.max(1,Math.round(s/60))+'분 전'; if (s<86400) return Math.round(s/3600)+'시간 전'; return Math.round(s/86400)+'일 전'; }
async function visit(id){
  markDirty(); saveRemote(true);
  const {data, error} = await sb.from('villages').select('*').eq('user_id', id).maybeSingle();
  if (error || !data){ toast('마을을 찾지 못했어요'); return; }
  closeModal(true);
  if (deco) endDeco();
  for (const c of customers()) removeNpc(c);
  mode = 'visit'; viewData = normalize(data.data); viewData.name = data.nickname; visitInfo = {user_id:id, nickname:data.nickname, hearts:data.hearts};
  document.body.classList.add('visiting'); $('visitbar').classList.add('show'); $('visitName').textContent = `${data.nickname}의 마을 · 💗${data.hearts}`;
  P.x = 0; P.z = 18; P.rot = Math.PI;
  buildVillage(viewData); buildPlayer(); paused = false; SFX.happy();
  toast(`${data.nickname}의 마을에 놀러 왔어요! 우체통에 방명록을 남길 수 있어요`);
}
$('vHome').onclick = () => { enterHome(); toast('집으로 돌아왔어요'); };
$('vHeart').onclick = async () => {
  const k = `kkoma-heart:${user.id}:${visitInfo.user_id}:${new Date().toDateString()}`;
  if (localStorage.getItem(k)){ toast('오늘은 이미 하트를 보냈어요 💗'); return; }
  const {data, error} = await sb.rpc('send_heart', {target: visitInfo.user_id});
  if (error){ toast('하트 보내기 실패: '+error.message); return; }
  try{ localStorage.setItem(k,'1'); }catch(e){}
  visitInfo.hearts = data ?? visitInfo.hearts+1; $('visitName').textContent = `${visitInfo.nickname}의 마을 · 💗${visitInfo.hearts}`; SFX.happy(); toast('💗 하트를 보냈어요!');
};
$('vNote').onclick = () => writeGuestbook();
function writeGuestbook(){
  const m = openModal(`<h2>✏️ 방명록</h2><p class="sub">${esc(visitInfo.nickname)}에게 한마디 남겨요</p>
    <textarea id="msg" maxlength="80" rows="3" placeholder="빵 냄새가 좋아요! (80자까지)"></textarea><div class="err" id="err"></div><button class="btn" id="send">남기기</button>
    <div class="list" id="gbl" style="margin-top:14px"></div>`);
  sb.from('guestbook').select('*').eq('owner_id', visitInfo.user_id).order('created_at',{ascending:false}).limit(10).then(({data}) => {
    const l = m.querySelector('#gbl'); if (l && data) l.innerHTML = data.map(g=>`<div class="gb"><small>${esc(g.author_name)} · ${ago(g.created_at)}</small>${esc(g.message)}</div>`).join(''); });
  m.querySelector('#send').onclick = async () => {
    const msg = m.querySelector('#msg').value.trim(); if (!msg) return;
    m.querySelector('#send').disabled = true;
    const {error} = await sb.from('guestbook').insert({owner_id:visitInfo.user_id, author_id:user.id, author_name:S.name, message:msg});
    if (error){ m.querySelector('#err').textContent = '실패: '+error.message; m.querySelector('#send').disabled = false; return; }
    SFX.ding(); closeModal(); toast('방명록을 남겼어요 💌');
  };
}
async function checkMail(silent){
  if (!ONLINE || !user) return [];
  const {data} = await sb.from('guestbook').select('*').eq('owner_id', user.id).order('created_at',{ascending:false}).limit(30);
  const seen = +(localStorage.getItem('kkoma-mailseen:'+user.id)||0);
  const fresh = (data||[]).filter(g => new Date(g.created_at).getTime() > seen);
  $('mailDot').style.display = fresh.length ? 'block' : 'none';
  if (silent && fresh.length) toast(`💌 새 방명록 ${fresh.length}개가 와 있어요`);
  return data||[];
}
async function openMail(){
  if (!ONLINE || !user){ openModal(`<h2>💌 편지함</h2><p class="sub">로그인하면 이웃이 남긴 방명록을 볼 수 있어요</p>
    <div class="list">${Object.entries(S.gifted).map(([a,it])=>`<div class="gb"><small>${ANIMALS.find(x=>x.id===a)?.name}</small>선물 ${ITEMS[it]?.em||''} 고마워!</div>`).join('')}</div>`); return; }
  const m = openModal(`<h2>💌 편지함</h2><p class="sub">이웃들이 남긴 방명록</p><div class="list" id="ml"><p class="sub">불러오는 중…</p></div>`);
  const data = await checkMail();
  try{ localStorage.setItem('kkoma-mailseen:'+user.id, Date.now()); }catch(e){} $('mailDot').style.display='none';
  const l = m.querySelector('#ml'); if (!l) return;
  l.innerHTML = data.length ? data.map(g=>`<div class="gb"><small>${esc(g.author_name)} · ${ago(g.created_at)}</small>${esc(g.message)}</div>`).join('') : '<p class="sub">아직 방명록이 없어요. 이웃 마을에 먼저 놀러 가봐요!</p>';
}
$('bVisit').onclick = () => { unlockAudio(); mode==='visit' ? openVisit() : openVisit(); };
$('bMail').onclick = () => { unlockAudio(); openMail(); };
$('bMenu').onclick = () => {
  const fr = ANIMALS.filter(a=>S.friends[a.id]).map(a=>`<div class="li"><div class="grow">${a.name} <small>${SPECIES[a.sp]} · 좋아하는 빵 ${BREADS[a.fav].em}</small></div><div>💗${S.friends[a.id]}${S.residents.includes(a.id)?' 🏡':''}</div></div>`).join('');
  const m = openModal(`<h2>⚙️ 메뉴</h2><p class="sub">${esc(S.name)} · Lv.${S.level} · 손님 ${S.stats.served}명 · 완벽한 빵 ${S.stats.perfect}개<br>${ONLINE&&user?'☁️ 계정에 자동 저장 중':'📱 이 기기에 저장 중'}</p>
    <h3 style="font-weight:400;margin:6px 0">단골 손님</h3><div class="list">${fr || '<p class="sub">아직 단골이 없어요</p>'}</div>
    <div class="row"><button class="btn sec" id="mLook">모습 바꾸기</button>${ONLINE&&sb ? (user?'<button class="btn sec" id="mOut">로그아웃</button>':'<button class="btn sec" id="mIn">로그인</button>') : ''}</div>`);
  m.querySelector('#mLook').onclick = () => {
    if (mode!=='home') return toast('집에서 바꿀 수 있어요');
    const order = Object.keys(SPECIES); S.species = order[(order.indexOf(S.species)+1)%order.length]; buildPlayer(); markDirty(); toast(`${SPECIES[S.species]}(으)로 바꿨어요! 한 번 더 누르면 또 바뀌어요`);
  };
  const out = m.querySelector('#mOut'); if (out) out.onclick = async () => { markDirty(); await saveRemote(true); await sb.auth.signOut(); location.reload(); };
  const inn = m.querySelector('#mIn'); if (inn) inn.onclick = () => { closeModal(true); paused = true; showTitle(); };
};

window.__dbg = { get S(){return S;}, P, get npcs(){return npcs;}, get holding(){return holding;}, get mode(){return mode;}, spawnCustomer, doAction, openOven, openDeco, startDeco, serve, gainXp };
requestAnimationFrame(tick);
camera.position.set(0, 14, 16); camera.lookAt(0,1,0);
updateSky();
boot();
</script>
